<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #ic { position: absolute; left: 0; top: 0; border-radius: 22%; background: radial-gradient(circle at 35% 30%, #ffe27a, #f6c445 55%, #e8a92b); box-sizing: border-box; border: solid #2b2236; display: flex; align-items: center; justify-content: center; }
  #ic svg { width: 86%; height: 86%; overflow: visible; }
</style></head>
<body>
<div id="ic"></div>
<script>const NIVEAU = { classe: "" };   // art.js lit la fiche du niveau ; inutile pour dessiner l'icône</script>
<script src="../moteur/js/art.js"></script>
<script>
  // taille demandée dans l'adresse : icone.html?s=256
  const s = Number(new URLSearchParams(location.search).get("s") || 256);
  const ic = document.getElementById("ic");
  ic.style.width = ic.style.height = s + "px";
  ic.style.borderWidth = Math.max(1, Math.round(s / 36)) + "px";
  ic.innerHTML = Art.boulon().replace('class="bob"', "");
</script>
</body></html>
