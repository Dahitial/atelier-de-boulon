<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparaison des voix</title>
<style>
  :root { --ink:#2b2236; --paper:#fff8ea; --y:#f6c445; }
  body { margin:0; font-family:"Trebuchet MS",system-ui,sans-serif; background:#2f6f73; color:var(--ink); }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { color:#fff; font-family:"Segoe Print","Comic Sans MS",cursive; text-shadow:2px 2px 0 var(--ink); margin:8px 0 4px; }
  p.lead { color:#fff; margin:0 0 14px; }
  section { background:var(--paper); border:3px solid var(--ink); border-radius:18px; padding:12px 16px; margin-bottom:14px; }
  h2 { margin:0 0 4px; font-size:22px; }
  .tag { font-size:13px; font-weight:700; padding:2px 8px; border-radius:10px; border:2px solid var(--ink); background:var(--y); margin-left:6px; }
  .info { font-size:14px; margin:0 0 10px; opacity:.8; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:4px 6px; font-size:14px; vertical-align:middle; }
  th { font-size:13px; opacity:.7; }
  audio { width:220px; height:34px; }
  .missing { opacity:.5; font-style:italic; }
  @media (max-width:700px){ audio{ width:140px; } }
</style>
</head>
<body>
<main>
  <h1>🎧 Quelle voix pour Boulon ?</h1>
  <p class="lead">Les mêmes 4 phrases, générées gratuitement par chaque moteur. Écoute, puis dis-moi ta préférée.</p>
  <div id="list"></div>
</main>
<script>
const PHRASES = [["accueil","Bonjour ! Je suis Boulon…"],["bravo","Bravo, champion !…"],["erreur","Oups ! Ce n'est pas grave…"],["consigne","Clique sur l'adjectif…"]];
const GROUPS = [
  { title: "edge-tts — Vivienne", tag: "en ligne", info: "Voix naturelle Microsoft (la même que dans Edge), générée en fichier.", prefix: "edge_vivienne", styles: ["neutre","joyeux"], ext: "mp3" },
  { title: "edge-tts — Denise", tag: "en ligne", info: "Voix naturelle Microsoft, plus posée.", prefix: "edge_denise", styles: ["neutre","joyeux"], ext: "mp3" },
  { title: "edge-tts — Eloise", tag: "en ligne", info: "Voix naturelle Microsoft, voix d'enfant.", prefix: "edge_eloise", styles: ["neutre","joyeux"], ext: "mp3" },
  { title: "edge-tts — Rémy", tag: "en ligne", info: "Voix naturelle Microsoft, voix d'homme (prévue pour Zigzag).", prefix: "edge_remy", styles: ["neutre","joyeux"], ext: "mp3" },
  { title: "Chatterbox", tag: "hors ligne", info: "Modèle libre qui force l'émotion (exaggeration). Généré sur ton processeur.", prefix: "chatterbox", styles: ["normal","joyeux"], ext: "wav" },
  { title: "Piper — siwis", tag: "hors ligne", info: "Très léger et rapide, mais au ton plutôt neutre.", prefix: "piper_siwis", styles: ["neutre","joyeux"], ext: "wav" },
];
const list = document.getElementById("list");
for (const g of GROUPS) {
  const sec = document.createElement("section");
  sec.innerHTML = `<h2>${g.title}<span class="tag">${g.tag}</span></h2><p class="info">${g.info}</p>`;
  const t = document.createElement("table");
  t.innerHTML = `<tr><th>Phrase</th>${g.styles.map(s => `<th>${s}</th>`).join("")}</tr>`;
  for (const [k, label] of PHRASES) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${label}</td>` + g.styles.map(s => `<td><audio controls preload="none" src="echantillons/${g.prefix}_${s}_${k}.${g.ext}"></audio></td>`).join("");
    t.appendChild(tr);
  }
  sec.appendChild(t);
  list.appendChild(sec);
}
</script>
</body>
</html>
