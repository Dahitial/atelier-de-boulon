name: Signaler un problème
description: Quelque chose ne marche pas, une réponse est fausse, un texte a une faute…
title: "[Problème] "
labels: ["problème"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de nous aider ! Ce que vous écrivez ici est **public** :
        n'indiquez ni le nom ni aucune information personnelle de l'enfant.
  - type: dropdown
    id: niveau
    attributes:
      label: Quelle classe ?
      options: ["CP", "CE2"]
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Comment l'enfant joue-t-il ?
      options: ["En ligne, sur le site", "Jeu installé sur Windows", "Je ne sais pas"]
    validations:
      required: true
  - type: input
    id: endroit
    attributes:
      label: Où dans le jeu ?
      placeholder: "Par exemple : Lire › Le son [p], ou le défi de Zigzag, ou le jardin"
  - type: textarea
    id: probleme
    attributes:
      label: Que s'est-il passé ?
      description: Ce que vous avez vu, et ce que vous attendiez. Une capture d'écran aide beaucoup (glissez-la ici).
    validations:
      required: true
  - type: input
    id: ordinateur
    attributes:
      label: Ordinateur et navigateur (si vous le savez)
      placeholder: "Par exemple : Windows 11, Edge"
